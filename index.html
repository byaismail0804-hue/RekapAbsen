<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Absensi Siswa</title>
  
  <!-- Memuat Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Memuat React dan ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Memuat Babel untuk menerjemahkan JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #f0fdf4; /* Hijau muda ceria */ font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- GANTI URL INI DENGAN URL WEB APP APPS SCRIPT ANDA ---
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVUMm3HtnJdr6z8jBtcZkvShTyJEZWGQOJdVTredu6PaJgj4m2U3rRbrxlN5EWf582FQ/exec";

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [userData, setUserData] = useState(null);
      const [nisInput, setNisInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [hasAbsen, setHasAbsen] = useState(false);

      // Fungsi untuk Login
      const handleLogin = async (e) => {
        e.preventDefault();
        if (!nisInput) return;
        
        setIsLoading(true);
        setErrorMsg('');

        try {
          // Menggunakan 'text/plain' untuk menghindari CORS Preflight error di Google Apps Script
          const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'login', nis: nisInput })
          });
          
          const result = await response.json();
          
          if (result.status === 'success') {
            setUserData(result.data);
            setIsLoggedIn(true);
          } else {
            setErrorMsg(result.message);
          }
        } catch (error) {
          setErrorMsg('Terjadi kesalahan jaringan. Coba lagi!');
        } finally {
          setIsLoading(false);
        }
      };

      // Fungsi untuk Absen
      const handleAbsen = async () => {
        setIsLoading(true);
        
        try {
          const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'absen',
              nis: userData.nis,
              nama: userData.nama,
              kelas: userData.kelas
            })
          });
          
          const result = await response.json();
          
          if (result.status === 'success') {
            setHasAbsen(true);
          } else {
            alert("Gagal absen: " + result.message);
          }
        } catch (error) {
          alert("Terjadi kesalahan jaringan.");
        } finally {
          setIsLoading(false);
        }
      };

      // --- TAMPILAN FORM LOGIN ---
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm border-t-8 border-green-500">
              <div className="text-center mb-8">
                <div className="text-5xl mb-4">🏫</div>
                <h1 className="text-2xl font-bold text-gray-800">Halo, Anak Hebat!</h1>
                <p className="text-gray-500 text-sm mt-2">Silakan masukkan NIS kamu untuk mulai belajar</p>
              </div>
              
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <input
                    type="number"
                    value={nisInput}
                    onChange={(e) => setNisInput(e.target.value)}
                    placeholder="Masukkan NIS..."
                    className="w-full px-4 py-3 rounded-lg border-2 border-gray-200 outline-none focus:border-green-500 text-center text-xl font-semibold tracking-wider transition"
                    required
                  />
                </div>
                
                {errorMsg && (
                  <div className="bg-red-100 text-red-600 p-3 rounded-lg text-sm text-center font-medium">
                    {errorMsg}
                  </div>
                )}
                
                <button
                  type="submit"
                  disabled={isLoading}
                  className={`w-full py-3 px-4 rounded-lg text-white font-bold text-lg transition shadow-md 
                    ${isLoading ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-500 hover:bg-green-600 hover:-translate-y-1'}`}
                >
                  {isLoading ? 'Mencari...' : 'Masuk 🚀'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // --- TAMPILAN DASHBOARD ABSENSI ---
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md border-t-8 border-blue-500 text-center">
            <div className="text-6xl mb-4">👋</div>
            <h1 className="text-2xl font-bold text-gray-800 mb-1">Halo, {userData.nama}!</h1>
            <p className="text-lg text-blue-600 font-semibold mb-8">Kelas {userData.kelas}</p>
            
            {hasAbsen ? (
              <div className="bg-green-100 border-2 border-green-200 text-green-700 p-6 rounded-xl animate-bounce">
                <div className="text-4xl mb-2">✅</div>
                <h2 className="text-xl font-bold">Hore! Kamu sudah absen.</h2>
                <p className="text-sm mt-2">Selamat mengikuti pembelajaran daring hari ini. Tetap semangat!</p>
              </div>
            ) : (
              <div className="space-y-4">
                <p className="text-gray-600">Klik tombol di bawah ini sebagai tanda kehadiran kamu hari ini ya!</p>
                <button
                  onClick={handleAbsen}
                  disabled={isLoading}
                  className={`w-full py-4 px-6 rounded-xl text-white font-bold text-xl transition shadow-lg transform
                    ${isLoading ? 'bg-gray-400' : 'bg-blue-500 hover:bg-blue-600 hover:scale-105 active:scale-95'}`}
                >
                  {isLoading ? 'Menyimpan...' : 'Hadir Pembelajaran Daring 💻'}
                </button>
              </div>
            )}
            
            <button 
              onClick={() => window.location.reload()} 
              className="mt-8 text-sm text-gray-400 hover:text-gray-600 underline"
            >
              Bukan {userData.nama}? Keluar
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
